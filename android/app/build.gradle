plugins { id 'com.android.application' }
android {
    namespace 'com.reversecoin.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.reversecoin.game'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html' }
}
